<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MediaPipe 动作范本评估</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071013;
        --panel: rgba(15, 29, 34, 0.94);
        --border: #29434b;
        --text: #f3f8f9;
        --muted: #96aeb4;
        --cyan: #25f4ee;
        --pink: #fe2c55;
        --yellow: #ffd166;
        --green: #49dd92;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family:
          Inter,
          'Microsoft YaHei',
          system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(
            circle at 12% 0%,
            rgba(37, 244, 238, 0.13),
            transparent 34rem
          ),
          radial-gradient(
            circle at 92% 4%,
            rgba(254, 44, 85, 0.11),
            transparent 32rem
          ),
          var(--bg);
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        padding: 24px 28px 18px;
        border-bottom: 1px solid var(--border);
      }
      h1 {
        margin: 0 0 7px;
        font-size: clamp(24px, 3vw, 36px);
      }
      h2,
      p {
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .status {
        max-width: min(560px, 46vw);
        padding: 9px 13px;
        border: 1px solid rgba(37, 244, 238, 0.38);
        border-radius: 999px;
        color: var(--cyan);
        background: rgba(37, 244, 238, 0.08);
        text-align: right;
      }
      main {
        padding: 20px 28px 34px;
      }
      .toolbar,
      .metrics,
      .notice {
        margin-bottom: 16px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr 1.35fr auto auto;
        gap: 12px;
        align-items: end;
      }
      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
      }
      select,
      input[type='file'],
      button {
        width: 100%;
        min-height: 42px;
        padding: 8px 11px;
        border: 1px solid #3a5962;
        border-radius: 9px;
        color: var(--text);
        background: #101f24;
      }
      button {
        width: auto;
        min-width: 132px;
        cursor: pointer;
        font-weight: 800;
      }
      button.primary {
        border-color: rgba(37, 244, 238, 0.6);
        color: #04272a;
        background: var(--cyan);
      }
      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }
      .check {
        display: flex;
        min-height: 42px;
        align-items: center;
        gap: 8px;
        color: var(--text);
        white-space: nowrap;
      }
      .progress {
        display: none;
        height: 10px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #203239;
      }
      .progress.active {
        display: block;
      }
      .progress > div {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), #5995ff);
        transition: width 0.2s ease;
      }
      .stage {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel);
      }
      .card-title {
        display: flex;
        min-height: 54px;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
      }
      .video-shell {
        display: grid;
        min-height: 470px;
        max-height: 67vh;
        place-items: center;
        overflow: hidden;
        background:
          linear-gradient(45deg, #0a1519 25%, transparent 25%),
          linear-gradient(-45deg, #0a1519 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #0a1519 75%),
          linear-gradient(-45deg, transparent 75%, #0a1519 75%), #0d1a1e;
        background-position:
          0 0,
          0 12px,
          12px -12px,
          -12px 0;
        background-size: 24px 24px;
      }
      .overlay-stack {
        position: relative;
        display: grid;
        max-width: 100%;
        max-height: 67vh;
        place-items: center;
      }
      video,
      canvas {
        display: block;
        max-width: 100%;
        max-height: 67vh;
        object-fit: contain;
      }
      .overlay-stack video,
      .overlay-stack canvas {
        grid-area: 1 / 1;
      }
      .overlay-stack canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .mirrored {
        transform: scaleX(-1);
      }
      .legend {
        display: flex;
        min-height: 48px;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 5px;
        border-radius: 50%;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(7, minmax(100px, 1fr));
        margin-top: 16px;
        margin-bottom: 0;
      }
      .metric {
        min-width: 0;
        padding: 7px 10px;
        border-right: 1px solid var(--border);
      }
      .metric:last-child {
        border-right: 0;
      }
      .metric strong {
        display: block;
        margin-top: 6px;
        overflow: hidden;
        color: var(--cyan);
        font-size: 20px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #overallScore {
        color: var(--green);
        font-size: 26px;
      }
      .notice {
        margin-top: 16px;
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.65;
      }
      .warning {
        color: var(--yellow);
      }
      @media (max-width: 1060px) {
        .toolbar {
          grid-template-columns: repeat(2, 1fr);
        }
        .stage {
          grid-template-columns: 1fr;
        }
        .metrics {
          grid-template-columns: repeat(2, 1fr);
        }
        .metric {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        .video-shell {
          min-height: 340px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>MediaPipe 动作范本评估</h1>
        <p class="muted">
          左侧查看标准范本，右侧导入本地视频并提取骨架；视频不会上传。
        </p>
      </div>
      <div id="status" class="status">正在读取动作数据……</div>
    </header>

    <main>
      <section class="toolbar">
        <label>
          动作类别
          <select id="datasetSelect"></select>
        </label>
        <label>
          标准范本
          <select id="referenceSelect"></select>
        </label>
        <label>
          导入待评估视频
          <input
            id="videoFile"
            type="file"
            accept="video/mp4,video/webm,video/quicktime,video/*"
          />
        </label>
        <label>
          判例方向
          <span class="check">
            <input id="mirrorInput" type="checkbox" />
            输入视频为镜像
          </span>
        </label>
        <button id="analyzeButton" class="primary" type="button" disabled>
          提取并评估
        </button>
      </section>

      <div id="progress" class="progress" aria-label="分析进度">
        <div id="progressFill"></div>
      </div>

      <section class="stage">
        <article class="card">
          <div class="card-title">
            <h2>标准范本骨架</h2>
            <span id="referenceInfo" class="muted">—</span>
          </div>
          <div class="video-shell">
            <div class="overlay-stack">
              <video
                id="referenceVideo"
                controls
                muted
                playsinline
                preload="metadata"
              ></video>
              <canvas id="referenceCanvas"></canvas>
            </div>
          </div>
          <div class="legend">
            <span><i class="dot" style="background: #25f4ee"></i>身体</span>
            <span><i class="dot" style="background: #fe2c55"></i>左手</span>
            <span><i class="dot" style="background: #ffd166"></i>右手</span>
          </div>
        </article>

        <article class="card">
          <div class="card-title">
            <h2>导入判例骨架</h2>
            <span id="caseInfo" class="muted">等待导入视频</span>
          </div>
          <div class="video-shell">
            <div id="caseStack" class="overlay-stack">
              <video
                id="caseVideo"
                controls
                muted
                playsinline
                preload="metadata"
              ></video>
              <canvas id="caseCanvas"></canvas>
            </div>
          </div>
          <div class="legend">
            <span><i class="dot" style="background: #25f4ee"></i>身体</span>
            <span><i class="dot" style="background: #fe2c55"></i>左手</span>
            <span><i class="dot" style="background: #ffd166"></i>右手</span>
            <span id="caseWarning" class="warning"></span>
          </div>
        </article>
      </section>

      <section class="metrics" aria-label="评估结果">
        <div class="metric">
          <span class="muted">动作相似度</span>
          <strong id="overallScore">—</strong>
        </div>
        <div class="metric">
          <span class="muted">Pose</span>
          <strong id="poseScore">—</strong>
        </div>
        <div class="metric">
          <span class="muted">左手</span>
          <strong id="leftScore">—</strong>
        </div>
        <div class="metric">
          <span class="muted">右手</span>
          <strong id="rightScore">—</strong>
        </div>
        <div class="metric">
          <span class="muted">轨迹</span>
          <strong id="trajectoryScore">—</strong>
        </div>
        <div class="metric">
          <span class="muted">骨架覆盖</span>
          <strong id="coverageScore">—</strong>
        </div>
        <div class="metric">
          <span class="muted">最接近范本</span>
          <strong id="bestTemplate">—</strong>
        </div>
      </section>

      <section class="notice">
        <strong id="decisionText">尚未评估。</strong>
        <span id="evaluationNote">
          “动作相似度”是当前视频与同类范本的骨架匹配分，不是模型在大规模测试集上的统计准确率。
        </span>
      </section>
    </main>

    <script type="module" src="/viewer.js"></script>
  </body>
</html>
